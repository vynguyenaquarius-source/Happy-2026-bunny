<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:black;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

canvas{
  position:fixed;
  top:0;
  left:0;
}

.text{
  position:absolute;
  top:30%;
  width:100%;
  text-align:center;
  font-size:5vw;
  font-weight:bold;
  color:white;
  text-shadow:
    0 0 10px #fff,
    0 0 30px #ff00ff,
    0 0 60px #00ffff;
  z-index:10;
}

.hint{
  position:absolute;
  bottom:5%;
  width:100%;
  text-align:center;
  font-size:14px;
  color:white;
  opacity:0.6;
}
</style>
</head>

<body>

<div class="text">
HAPPY NEW YEAR<br>MY STAR ✨
</div>

<div class="hint">✨ Chạm màn hình để bật nhạc ✨</div>

<audio id="music" src="HPNY.mp3"></audio>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");

let w,h;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  createBuildings();
}
window.addEventListener("resize",resize);
resize();

/* PLAY MUSIC */
document.body.addEventListener("click",()=>{
  music.play();
},{once:true});

/* STARS */
let stars=[];
for(let i=0;i<200;i++){
  stars.push({
    x:Math.random()*w,
    y:Math.random()*h,
    size:Math.random()*2,
    alpha:Math.random(),
    speed:(Math.random()*0.02)+0.005
  });
}

/* BUILDINGS (STATIC) */
let buildings=[];

function createBuildings(){
  buildings=[];
  let base=h*0.8;
  let x=0;

  while(x<w){
    let bw=50+Math.random()*60;
    let bh=100+Math.random()*150;

    let windows=[];
    for(let wy=base-bh+15; wy<base-15; wy+=22){
      for(let wx=x+10; wx<x+bw-10; wx+=20){
        windows.push({
          x:wx,
          y:wy,
          on:Math.random()>0.5,
          blink:0.01+Math.random()*0.02
        });
      }
    }

    buildings.push({x,y:base-bh,w:bw,h:bh,windows});
    x+=bw+15;
  }
}

function drawBuildings(){
  let base=h*0.8;

  ctx.fillStyle="#0d1325";
  ctx.fillRect(0,base,w,h-base);

  buildings.forEach(b=>{
    ctx.fillStyle="#111a33";
    ctx.fillRect(b.x,b.y,b.w,b.h);

    ctx.strokeStyle="white";
    ctx.strokeRect(b.x,b.y,b.w,b.h);

    b.windows.forEach(win=>{
      if(Math.random()<win.blink){
        win.on=!win.on;
      }
      if(win.on){
        ctx.fillStyle="white";
        ctx.fillRect(win.x,win.y,6,10);
      }
    });
  });
}

/* FIREWORKS */
let rockets=[];
let particles=[];
let colors=["#ff0043","#14fc56","#1e90ff","#ffae00","#ff00ff","#00ffff"];

function launch(){
  rockets.push({
    x:Math.random()*w,
    y:h*0.8,
    target:h*(0.2+Math.random()*0.4),
    speed:6,
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}
setInterval(launch,900);

function explode(x,y,color){
  for(let i=0;i<120;i++){
    particles.push({
      x,y,
      angle:Math.random()*Math.PI*2,
      speed:Math.random()*5+2,
      alpha:1,
      color,
      gravity:0.06
    });
  }
}

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.3)";
  ctx.fillRect(0,0,w,h);

  /* stars */
  stars.forEach(s=>{
    s.alpha+=s.speed;
    if(s.alpha>=1||s.alpha<=0) s.speed*=-1;
    ctx.globalAlpha=s.alpha;
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;

  /* rockets */
  rockets.forEach((r,i)=>{
    r.y-=r.speed;
    ctx.fillStyle=r.color;
    ctx.beginPath();
    ctx.arc(r.x,r.y,3,0,Math.PI*2);
    ctx.fill();

    if(r.y<=r.target){
      explode(r.x,r.y,r.color);
      rockets.splice(i,1);
    }
  });

  /* particles falling */
  particles.forEach((p,i)=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.97;
    p.y+=p.gravity*8;
    p.alpha-=0.01;

    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fill();

    if(p.alpha<=0) particles.splice(i,1);
  });
  ctx.globalAlpha=1;

  drawBuildings();
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
