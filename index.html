<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    height: 100%;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
}

/* ===== TITLE ===== */
/* ===== TITLE ===== */
.title {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    font-weight: bold;
}

.line {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 4px; /* chỉnh khoảng cách chữ ở đây */
    font-size: clamp(22px, 3.5vw, 60px);
}


/* Chỉ animate xuất hiện từng chữ */
.title span {
    display: inline-block;
color: white;
    opacity: 0;
    transform: scale(0.2);
    animation:
        explodeIn 1.2s ease-out forwards,
        pulseLoop 2.5s ease-in-out 1.2s infinite;
    animation-delay: calc(0.05s * var(--i)), 1.2s;
    white-space: nowrap;
}


/* Xuất hiện */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Nhấp nháy cả dòng */
@keyframes pulseLine {
    0%,100% {
        transform: scale(1);
        text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
    }
    50% {
        transform: scale(1.05);
        text-shadow: 0 0 25px #ff66ff, 0 0 50px #00ffff;
    }
}


/* Bay ra */
@keyframes explodeIn {
    0% {
        opacity: 0;
        transform: scale(0.2);
    }
    60% {
        opacity: 1;
        transform: scale(1.15);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}


@keyframes pulseLoop {
    0%,100% {
        text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
    }
    50% {
        text-shadow: 0 0 25px #ff66ff, 0 0 50px #00ffff;
    }
}




/* tap hint */
.tap {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #aaa;
    font-size: 14px;
    z-index: 20;
}
</style>
</head>

<body>

<div class="title">
  <div class="line">
    <span style="--i:1">H</span><span style="--i:2">A</span>
    <span style="--i:3">P</span><span style="--i:4">P</span>
    <span style="--i:5">Y</span>
    <span style="--i:6">&nbsp;</span>
    <span style="--i:7">N</span><span style="--i:8">E</span>
    <span style="--i:9">W</span>
    <span style="--i:10">&nbsp;</span>
    <span style="--i:11">Y</span><span style="--i:12">E</span>
    <span style="--i:13">A</span><span style="--i:14">R</span>
  </div>
  <div class="line">
    <span style="--i:15">M</span><span style="--i:16">Y</span>
    <span style="--i:17">&nbsp;</span>
    <span style="--i:18">S</span><span style="--i:19">T</span>
    <span style="--i:20">A</span><span style="--i:21">R</span>
    <span style="--i:22">&nbsp;</span><span style="--i:23">✨</span>
  </div>
</div>

<div class="tap" id="tapHint">✨ Chạm màn hình để bật nhạc ✨</div>

<canvas id="canvas"></canvas>
<audio id="music" src="HPNY.mp3" loop></audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const tapHint = document.getElementById("tapHint");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* MUSIC */
function startMusic(){
    music.play().catch(()=>{});
    tapHint.style.display="none";
    document.removeEventListener("click",startMusic);
    document.removeEventListener("touchstart",startMusic);
}
document.addEventListener("click",startMusic);
document.addEventListener("touchstart",startMusic);

/* BUILDINGS */
let buildings=[];
function createBuildings(){
    buildings=[];
    let x=0;
    while(x<canvas.width){
        let w=40+Math.random()*50;
        let h=80+Math.random()*150;
        buildings.push({x,y:canvas.height-h,w,h,
            windows:Array.from({length:10},()=>Math.random()>0.5)});
        x+=w+5;
    }
}
createBuildings();

function drawBuildings(){
    buildings.forEach(b=>{
        ctx.fillStyle="#0a0a1a";
        ctx.fillRect(b.x,b.y,b.w,b.h);
        for(let i=0;i<5;i++){
            for(let j=0;j<2;j++){
                if(Math.random()>0.98) b.windows[i*2+j]=!b.windows[i*2+j];
                if(b.windows[i*2+j]){
                    ctx.fillStyle="#fffacd";
                    ctx.fillRect(b.x+10+j*15,b.y+10+i*25,8,15);
                }
            }
        }
    });
}

/* STARS */
let stars=Array.from({length:120},()=>({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    r:Math.random()*2,
    a:Math.random()
}));

function drawStars(){
    stars.forEach(s=>{
        s.a+=(Math.random()-0.5)*0.05;
        if(s.a<0)s.a=0;
        if(s.a>1)s.a=1;
        ctx.fillStyle="rgba(255,255,255,"+s.a+")";
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });
}

/* FIREWORKS */
let fireworks=[];
function launchFirework(){
    fireworks.push({
        x:Math.random()*canvas.width,
        y:canvas.height,
        targetY:100+Math.random()*canvas.height/2,
        exploded:false,
        particles:[]
    });
}
setInterval(launchFirework,800);

function updateFireworks(){
    fireworks.forEach(f=>{
        if(!f.exploded){
            f.y-=5;
            ctx.fillStyle="white";
            ctx.fillRect(f.x,f.y,2,10);
            if(f.y<=f.targetY){
                f.exploded=true;
                for(let i=0;i<60;i++){
                    let angle=Math.random()*Math.PI*2;
                    let speed=Math.random()*4+2;
                    f.particles.push({
                        x:f.x,y:f.y,
                        vx:Math.cos(angle)*speed,
                        vy:Math.sin(angle)*speed,
                        alpha:1,
                        color:`hsl(${Math.random()*360},100%,50%)`
                    });
                }
            }
        }else{
            f.particles.forEach(p=>{
                p.x+=p.vx;
                p.y+=p.vy;
                p.vy+=0.05;
                p.alpha-=0.01;
                ctx.globalAlpha=p.alpha;
                ctx.fillStyle=p.color;
                ctx.fillRect(p.x,p.y,3,3);
                ctx.globalAlpha=1;
            });
        }
    });
    fireworks=fireworks.filter(f=>
        !f.exploded||f.particles.some(p=>p.alpha>0)
    );
}

function animate(){
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    drawStars();
    drawBuildings();
    updateFireworks();
    requestAnimationFrame(animate);
}
animate();


</script>

</body>
</html>
